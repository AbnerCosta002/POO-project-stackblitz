<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Aluno.js" defer></script>
    <script src="Turma.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="main.js" defer></script>
    <title>Sistema Escolar</title>
  </head>

  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button
        class="tab-button active"id="btn-cadastrar"onclick="cadastroAluno()">
        Cadastrar
      </button>

      <button class="tab-button" id="btn-listar" onclick="listarAluno()">
        Listar Alunos
      </button>
    </div>

    <!-- Conteúdo da Aba 1: Cadastrar -->
    <div id="tab-cadastrar" class="tab-content active">

      <h3>Cadastrar Aluno</h3>

      Nome do Aluno: <input id="nome" type="text" /> 
      Nota 1: <input id="n1" type="text" /> 
      Nota 2: <input id="n2" type="text" />
      Nota 3: <input id="n3" type="text" />
      Turma:
      <select id="Turma">
        <option value="">Selecione uma Turma</option>
      </select>
      <button onclick="btnSalvar()" class="btn-salvar">Salvar Aluno</button>

      <hr />

      <h3>Cadastrar Turma</h3>
      Nome da Turma: <input id="nomeT" type="text" /> 
      Curso: <input id="curso" type="text" /> 
      Professor: <input id="prof" type="text" />
      <button onclick="btnSalvarTurma()" class="btn-salvar">Salvar Turma</button>
    </div>

    <!-- Conteúdo da Aba 2: Listar -->
    <div id="tab-listar" class="tab-content">
      <h2>Alunos Cadastrados</h2>
      <!-- Trocado de <ul> para <div> para eliminar recuos indesejados -->
      <div id="alunos"></div>
    </div>
    
  </body>
</html>
